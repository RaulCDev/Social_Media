version: "3.9"

services:
  db-mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: socialmedia
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - my-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialnet

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./front:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - db-mysql
    networks:
      - socialnet

volumes:
  my-db:

networks:
  socialnet:
    driver: bridge
