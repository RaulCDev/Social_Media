name: social_media

services:
  db-mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - my-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: development
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5000/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PORT: ${API_PORT}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
    command: >-
      sh -c "flask --app app seed-demo &&
      flask --app app run --host 0.0.0.0 --port 5000 --debug"
    ports:
      - "${API_PORT}:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db-mysql:
        condition: service_healthy
    networks:
      - socialnet
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/**"
            - "**/.pytest_cache/**"
            - "**/.venv/**"
            - "**/venv/**"
            - "**/.mypy_cache/**"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/requirements-dev.txt

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: development
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./front:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    environment:
      NODE_ENV: ${NODE_ENV}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - db-mysql
    networks:
      - socialnet
    develop:
      watch:
        - action: sync
          path: ./front
          target: /usr/src/app
          ignore:
            - "**/node_modules/**"
            - "**/.next/**"
            - "**/dist/**"
            - "**/.git/**"
        - action: rebuild
          path: ./front/package.json

volumes:
  my-db:

networks:
  socialnet:
    driver: bridge
